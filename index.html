<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Do you love me 😡</title>

<style>
body {
  margin: 0;
  font-family: 'Comic Sans MS', cursive;
  background: linear-gradient(135deg, #ffd6e7, #ffc0cb);
  height: 100vh;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* floating hearts */
.heart {
  position: absolute;
  bottom: -20px;
  animation: floatUp linear infinite;
  color: #ff4d88;
  opacity: 0.7;
}

@keyframes floatUp {
  0% { transform: translateY(0); opacity: 0; }
  10% { opacity: 1; }
  100% { transform: translateY(-110vh); opacity: 0; }
}

/* card */
.card {
  background: rgba(255,255,255,0.9);
  padding: 40px;
  border-radius: 25px;
  text-align: center;
  box-shadow: 0 15px 40px rgba(0,0,0,0.2);
}

h1 {
  color: #ff4d88;
}

/* photo */
.my-photo {
  width: 160px;
  height: 160px;
  object-fit: cover;
  border-radius: 50%;
  margin: 15px 0;
  border: 5px solid #ff4d88;
  box-shadow: 0 0 20px #ff99cc;
}

/* buttons */
button {
  padding: 12px 25px;
  font-size: 18px;
  border: none;
  border-radius: 25px;
  margin: 10px;
  cursor: pointer;
  transition: 0.3s;
}

#yes {
  background: #ff4d88;
  color: white;
}

#yes:hover {
  transform: scale(1.1);
}

#no {
  background: white;
  color: #ff4d88;
  position: relative;
}

/* footer */
.footer {
  position: absolute;
  bottom: 10px;
  font-size: 14px;
  color: #ff4d88;
}
</style>
</head>

<body>

<div class="card">
  <h1>Do you love me 😡</h1>

  <!-- YOUR PHOTO -->
  <img src="me.jpg" class="my-photo">

  <br>
  <button id="yes">Yes 💖</button>
  <button id="no">No 😤</button>
</div>

<div class="footer">Made by Xander 💕</div>

<script>
// floating hearts
for (let i = 0; i < 25; i++) {
  let h = document.createElement("div");
  h.className = "heart";
  h.innerHTML = "💖";
  h.style.left = Math.random() * 100 + "vw";
  h.style.animationDuration = (3 + Math.random() * 5) + "s";
  h.style.fontSize = (12 + Math.random() * 20) + "px";
  document.body.appendChild(h);
}

// YES button
document.getElementById("yes").onclick = () => {
  document.body.innerHTML = `
    <div class="card">
      <h1>I love you too 😘</h1>
      <img src="me.jpg" class="my-photo">
      <p>💖 You're stuck with me now 💖</p>
      <button onclick="location.reload()">Play again</button>
    </div>
    <div class="footer">Made by Xander 💕</div>
  `;
};

// NO button troll
let size = 1;
let texts = ["No 😤","No?? 😳","Noooo 😭","Please 🥺","Stop 😡","..."];

document.getElementById("no").onclick = function() {
  size -= 0.1;
  if(size < 0.3) size = 0.3;

  let x = Math.random() * 300 - 150;
  let y = Math.random() * 300 - 150;

  this.style.transform = `scale(${size}) translate(${x}px, ${y}px)`;

  let index = Math.min(texts.length - 1, Math.floor((1 - size) * 10));
  this.innerText = texts[index];
};
</script>

</body>
</html>
