<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Do you love me 😡</title>

<style>
body {
  margin: 0;
  font-family: 'Comic Sans MS', cursive;
  background: linear-gradient(135deg, #ffd6e7, #ffc0cb);
  height: 100vh;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* floating hearts */
.heart {
  position: absolute;
  bottom: -20px;
  animation: floatUp linear infinite;
  color: #ff4d88;
  opacity: 0.6;
}

@keyframes floatUp {
  0% { transform: translateY(0); opacity: 0; }
  10% { opacity: 1; }
  100% { transform: translateY(-110vh); opacity: 0; }
}

/* card */
.card {
  width: 320px;
  background: rgba(255,255,255,0.9);
  padding: 25px;
  border-radius: 25px;
  text-align: center;
  box-shadow: 0 15px 40px rgba(0,0,0,0.2);
}

/* photo */
.my-photo {
  width: 130px;
  height: 130px;
  object-fit: cover;
  border-radius: 50%;
  margin: 10px 0;
  border: 4px solid #ff4d88;
  box-shadow: 0 0 15px #ff99cc;
}

/* buttons container */
.btn-area {
  position: relative;
  height: 140px;
  margin-top: 10px;
}

/* buttons */
button {
  padding: 10px 20px;
  font-size: 16px;
  border: none;
  border-radius: 25px;
  cursor: pointer;
  position: absolute;
  transition: all 0.25s ease;
}

#yes {
  background: #ff4d88;
  color: white;
  left: 30%;
  top: 50%;
  transform: translate(-50%, -50%);
}

#yes:hover {
  transform: translate(-50%, -50%) scale(1.1);
}

#no {
  background: white;
  color: #ff4d88;
  left: 70%;
  top: 50%;
  transform: translate(-50%, -50%);
}

/* footer */
.footer {
  position: absolute;
  bottom: 10px;
  font-size: 14px;
  color: #ff4d88;
}
</style>
</head>

<body>

<div class="card">
  <h2>Do you love me 😡</h2>

  <img src="me.jpg" class="my-photo">

  <div class="btn-area" id="area">
    <button id="yes">Yes 💖</button>
    <button id="no">No 😤</button>
  </div>
</div>

<div class="footer">Made by Xander 💕</div>

<script>
// floating hearts
for (let i = 0; i < 25; i++) {
  let h = document.createElement("div");
  h.className = "heart";
  h.innerHTML = "💖";
  h.style.left = Math.random() * 100 + "vw";
  h.style.animationDuration = (3 + Math.random() * 5) + "s";
  h.style.fontSize = (12 + Math.random() * 20) + "px";
  document.body.appendChild(h);
}

// YES click
document.getElementById("yes").onclick = () => {
  document.body.innerHTML = `
    <div class="card">
      <h2>I love you too 😘</h2>
      <img src="me.jpg" class="my-photo">
      <p>💖 You're mine now 💖</p>
      <button onclick="location.reload()">Play again</button>
    </div>
    <div class="footer">Made by Xander 💕</div>
  `;
};

// NO button logic (smooth + safe area)
const noBtn = document.getElementById("no");
const area = document.getElementById("area");

let scale = 1;

noBtn.onclick = () => {
  scale -= 0.08;
  if (scale < 0.4) scale = 0.4;

  const areaRect = area.getBoundingClientRect();

  const maxX = areaRect.width - 100;
  const maxY = areaRect.height - 50;

  const x = Math.random() * maxX;
  const y = Math.random() * maxY;

  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
  noBtn.style.transform = `scale(${scale})`;

  const texts = ["No 😤","No?? 😳","Stop 😭","Please 🥺","Don't 😡","..."];
  noBtn.innerText = texts[Math.floor(Math.random() * texts.length)];
};
</script>

</body>
</html>
